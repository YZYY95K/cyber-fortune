<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵境·赛博占卜</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');

  :root {
    --sage-50: #f6f9f6;
    --sage-100: #e8f0e8;
    --sage-200: #c8dcc8;
    --sage-300: #a3c9a3;
    --sage-400: #7ab07a;
    --sage-500: #5a9a5a;
    --sage-600: #4a7e4a;
    --sage-700: #3d663d;
    --sage-800: #345234;
    --sage-900: #2c442c;
    --mint: #b8e6c8;
    --emerald: #2d8a6e;
    --gold: #c9a84c;
    --rose: #e8c4c4;
    --bg: #0d1a0d;
    --card-bg: rgba(22, 42, 22, 0.85);
    --glass: rgba(30, 55, 30, 0.6);
    --text: #d4e8d4;
    --text-dim: #8ba88b;
    --accent: #5a9a5a;
    --accent-glow: rgba(90, 154, 90, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 星空粒子背景 */
  #particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .particle {
    position: absolute;
    border-radius: 50%;
    animation: floatUp linear infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 0.8; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* 主容器 */
  .app {
    position: relative;
    z-index: 1;
    width: 420px;
    max-width: 95vw;
    min-height: 600px;
    padding: 20px;
  }

  /* 标题 */
  .header {
    text-align: center;
    margin-bottom: 30px;
  }
  .header .icon {
    font-size: 48px;
    margin-bottom: 8px;
    animation: crystalPulse 3s ease-in-out infinite;
  }
  @keyframes crystalPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(90,154,90,0.5)); }
    50% { transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(90,154,90,0.8)); }
  }
  .header h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #b8e6c8, #7ab07a, #5a9a5a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .sub {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 4px;
    margin-top: 4px;
  }

  /* 卡片 */
  .card {
    background: var(--card-bg);
    border: 1px solid rgba(90, 154, 90, 0.25);
    border-radius: 20px;
    padding: 28px 24px;
    backdrop-filter: blur(20px);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(90, 154, 90, 0.1);
    transition: all 0.4s ease;
  }

  /* 模式选择 */
  .mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .mode-btn {
    background: var(--glass);
    border: 1px solid rgba(90, 154, 90, 0.2);
    border-radius: 14px;
    padding: 14px 10px;
    cursor: pointer;
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .mode-btn:hover {
    border-color: var(--accent);
    background: rgba(90, 154, 90, 0.15);
    transform: translateY(-2px);
  }
  .mode-btn.active {
    border-color: var(--accent);
    background: rgba(90, 154, 90, 0.2);
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .mode-btn .emoji { font-size: 24px; }
  .mode-btn .label { font-size: 13px; }

  /* 输入区 */
  .input-group {
    margin-bottom: 16px;
  }
  .input-group label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .input-group input, .input-group textarea {
    width: 100%;
    background: rgba(15, 30, 15, 0.6);
    border: 1px solid rgba(90, 154, 90, 0.3);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    outline: none;
    transition: all 0.3s ease;
  }
  .input-group input:focus, .input-group textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 16px var(--accent-glow);
  }
  .input-group input::placeholder, .input-group textarea::placeholder {
    color: rgba(139, 168, 139, 0.5);
  }
  .input-group textarea {
    resize: none;
    height: 60px;
  }
  .inline-inputs {
    display: flex;
    gap: 10px;
  }
  .inline-inputs .input-group { flex: 1; }

  /* 按钮 */
  .btn-primary {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #4a7e4a, #5a9a5a);
    border: none;
    border-radius: 14px;
    color: #fff;
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(90, 154, 90, 0.3);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 28px rgba(90, 154, 90, 0.5);
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* 结果区 */
  .result {
    display: none;
    text-align: center;
    animation: fadeIn 0.6s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result.show { display: block; }

  .result-crystal {
    font-size: 56px;
    margin: 10px 0;
    animation: crystalReveal 0.8s ease;
  }
  @keyframes crystalReveal {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    60% { transform: scale(1.2) rotate(10deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); }
  }

  .result-score {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--glass);
    border: 1px solid rgba(90, 154, 90, 0.3);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .result-score .star { color: var(--gold); font-size: 16px; }

  .result-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    font-weight: 700;
    color: #b8e6c8;
    margin-bottom: 6px;
  }
  .result-subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
    letter-spacing: 1px;
  }

  .result-divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 0 auto 16px;
  }

  .result-detail {
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    text-align: left;
    padding: 16px;
    background: rgba(15, 30, 15, 0.4);
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .result-detail .item {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid rgba(90, 154, 90, 0.1);
  }
  .result-detail .item:last-child { border: none; }
  .result-detail .item .key { color: var(--text-dim); }
  .result-detail .item .val { color: var(--text); font-weight: 500; }

  .result-advice {
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    color: var(--mint);
    line-height: 1.8;
    padding: 14px 16px;
    background: rgba(90, 154, 90, 0.08);
    border-radius: 12px;
    border-left: 3px solid var(--accent);
    text-align: left;
    margin-bottom: 16px;
  }

  .result-tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tag {
    background: rgba(90, 154, 90, 0.15);
    border: 1px solid rgba(90, 154, 90, 0.2);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 12px;
    color: var(--mint);
  }

  .btn-back {
    background: transparent;
    border: 1px solid rgba(90, 154, 90, 0.3);
    border-radius: 12px;
    padding: 10px 28px;
    color: var(--text-dim);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .btn-back:hover {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(90, 154, 90, 0.1);
  }

  /* 加载动画 */
  .loading {
    display: none;
    text-align: center;
    padding: 40px 0;
  }
  .loading.show { display: block; }
  .loading-ring {
    width: 50px;
    height: 50px;
    border: 3px solid rgba(90, 154, 90, 0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }

  /* 隐藏 */
  .hidden { display: none !important; }

  /* 响应式 */
  @media (max-width: 440px) {
    .app { padding: 16px; }
    .card { padding: 20px 16px; }
    .header h1 { font-size: 24px; }
    .mode-grid { gap: 8px; }
    .mode-btn { padding: 12px 8px; }
  }
</style>
</head>
<body>

<div id="particles"></div>

<div class="app">
  <div class="header">
    <div class="icon">🔮</div>
    <h1>灵境 · 赛博占卜</h1>
    <div class="sub">YOUR CYBER ORACLE</div>
  </div>

  <!-- 输入卡片 -->

      <button class="mode-btn active" data-mode="daily">
        <span class="emoji">✨</span>
        <span class="label">今日运势</span>
      </button>
      <button class="mode-btn" data-mode="love">
        <span class="emoji">💗</span>
        <span class="label">桃花运</span>
      </button>
      <button class="mode-btn" data-mode="career">
        <span class="emoji">🌟</span>
        <span class="label">事业 / 学业</span>
      </button>
      <button class="mode-btn" data-mode="mood">
        <span class="emoji">🌿</span>
        <span class="label">心情疗愈</span>
      </button>
    </div>

    <div class="input-group">
      <label>你的昵称</label>
      <input type="text" id="nameInput" placeholder="输入你的名字或昵称…" maxlength="20">
    </div>

    <div class="inline-inputs">
      <div class="input-group">
        <label>星座（选填）</label>
        <input type="text" id="zodiacInput" placeholder="如：双子座" maxlength="10">
      </div>
      <div class="input-group">
        <label>MBTI（选填）</label>
        <input type="text" id="mbtiInput" placeholder="如：INFJ" maxlength="8">
      </div>
    </div>

    <div class="input-group">
      <label>心里想问的事（选填）</label>
      <textarea id="questionInput" placeholder="悄悄告诉水晶球你想知道什么…"></textarea>
    </div>

    <button class="btn-primary" id="submitBtn">🔮 开启占卜</button>
  </div>

  <!-- 加载 -->
  <div class="card loading" id="loadingCard">
    <div class="loading-ring"></div>
    <div class="loading-text">水晶球正在感应你的能量…</div>
  </div>

  <!-- 结果卡片 -->
  <div class="card result" id="resultCard">
    <div class="result-crystal" id="resultCrystal"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-subtitle" id="resultSubtitle"></div>
    <div class="result-divider"></div>
    <div class="result-detail" id="resultDetail"></div>
    <div class="result-advice" id="resultAdvice"></div>
    <div class="result-tags" id="resultTags"></div>
    <button class="btn-back" onclick="resetApp()">再算一次</button>
  </div>
</div>

<script>
// ============ 粒子背景 ============
const particlesEl = document.getElementById('particles');
const symbols = ['✦', '✧', '⋆', '·', '✿', '🍃', '✨', '🔮', '🌿', '💚'];
for (let i = 0; i < 50; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.width = p.style.height = (Math.random() * 8 + 2) + 'px';
  p.style.background = ['#5a9a5a', '#b8e6c8', '#7ab07a', '#c9a84c'][Math.floor(Math.random() * 4)];
  p.style.animationDuration = (Math.random() * 12 + 8) + 's';
  p.style.animationDelay = Math.random() * 10 + 's';
  p.textContent = symbols[Math.floor(Math.random() * symbols.length)];
  p.style.fontSize = (Math.random() * 10 + 6) + 'px';
  p.style.color = p.style.background;
  p.style.background = 'transparent';
  particlesEl.appendChild(p);
}

// ============ 模式选择 ============
let currentMode = 'daily';
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
  });
});

// ============ 提交 ============
document.getElementById('submitBtn').addEventListener('click', () => {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) {
    document.getElementById('nameInput').focus();
    document.getElementById('nameInput').style.borderColor = '#e88';
    setTimeout(() => document.getElementById('nameInput').style.borderColor = '', 1500);
    return;
  }

  // 显示加载
  document.getElementById('inputCard').classList.add('hidden');
  document.getElementById('loadingCard').classList.add('show');
  document.getElementById('resultCard').classList.remove('show');

  // 模拟占卜延迟
  setTimeout(() => {
    generateResult(name);
    document.getElementById('loadingCard').classList.remove('show');
    document.getElementById('resultCard').classList.add('show');
    document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
  }, 1800 + Math.random() * 800);
});

// ============ 生成结果 ============
function generateResult(name) {
  const zodiac = document.getElementById('zodiacInput').value.trim();
  const mbti = document.getElementById('mbtiInput').value.trim();
  const question = document.getElementById('questionInput').value.trim();
  const data = fortuneData[currentMode];

  // 根据名字生成种子
  let seed = 0;
  for (let i = 0; i < name.length; i++) seed += name.charCodeAt(i);
  seed += Date.now() % 100;

  const crystal = data.crystals[seed % data.crystals.length];
  const score = data.scores[seed % data.scores.length];
  const titleIdx = seed % data.titles.length;
  const adviceIdx = seed % data.advices.length;

  // 水晶
  document.getElementById('resultCrystal').textContent = crystal;

  // 分数
  const stars = '⭐'.repeat(score) + '☆'.repeat(5 - score);
  document.getElementById('resultScore').innerHTML = `<span class="star">${stars}</span> <span>${['普通', '不错', '很好', '超棒', '爆棚'][score - 1]}运势</span>`;

  // 标题
  document.getElementById('resultTitle').textContent = data.titles[titleIdx];
  document.getElementById('resultSubtitle').textContent = data.subtitles[titleIdx % data.subtitles.length];

  // 详情
  const details = data.details(seed);
  document.getElementById('resultDetail').innerHTML = details.map(d =>
    `<div class="item"><span class="key">${d.key}</span><span class="val">${d.val}</span></div>`
  ).join('');

  // 建议
  let advice = data.advices[adviceIdx];
  if (question && question.length > 1) {
    advice = `关于你问的"${question.length > 15 ? question.slice(0, 15) + '…' : question}"——` + advice;
  }
  if (mbti) {
    advice += `\n\n${mbti}的你，天生就拥有独特的视角和力量。相信自己的直觉，它会带你走向正确的方向。`;
  }
  document.getElementById('resultAdvice').textContent = advice;

  // 标签
  const tags = [...data.tags].sort(() => Math.random() - 0.5).slice(0, 4);
  document.getElementById('resultTags').innerHTML = tags.map(t => `<span class="tag">${t}</span>`).join('');

  // 保存到 localStorage
  saveHistory(name, currentMode, score, data.titles[titleIdx]);
}

function saveHistory(name, mode, score, title) {
  const history = JSON.parse(localStorage.getItem('fortune_history') || '[]');
  history.unshift({ name, mode, score, title, time: new Date().toLocaleString() });
  if (history.length > 20) history.length = 20;
  localStorage.setItem('fortune_history', JSON.stringify(history));
}

function resetApp() {
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('inputCard').classList.remove('hidden');
  document.getElementById('nameInput').value = '';
  document.getElementById('questionInput').value = '';
  document.getElementById('inputCard').scrollIntoView({ behavior: 'smooth' });
}
</script>
